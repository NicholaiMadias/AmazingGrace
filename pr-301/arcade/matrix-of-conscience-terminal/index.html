<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nicholai Madias | Digital Architect & Arcade Matrix</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050811;
            --panel-bg: rgba(10, 16, 30, 0.85);
            --gold-primary: #f0c05a;
            --gold-glow: rgba(240, 192, 90, 0.3);
            --cyan-accent: #00f3ff;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --font-title: 'Cinzel', serif;
            --font-code: 'Fira Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-code);
            overflow: hidden;
        }

        /* Fullscreen Layout */
        .viewport {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 20%, #101c38 0%, var(--bg-dark) 80%);
        }

        /* Top Bar & Gamification Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: rgba(5, 8, 17, 0.95);
            border-bottom: 1px solid var(--gold-primary);
            box-shadow: 0 0 15px var(--gold-glow);
            z-index: 10;
        }

        .brand-title {
            font-family: var(--font-title);
            font-size: 1.25rem;
            color: var(--gold-primary);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-link {
            background: transparent;
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 6px 12px;
            font-family: var(--font-code);
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-link:hover {
            background: var(--gold-primary);
            color: var(--bg-dark);
            box-shadow: 0 0 10px var(--gold-primary);
        }

        .xp-badge {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--cyan-accent);
            color: var(--cyan-accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .accent-pill {
            color: var(--cyan-accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Workspace Navigation */
        .tab-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 16, 30, 0.8);
            border-bottom: 1px solid rgba(240, 192, 90, 0.2);
            padding: 0 16px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 12px 20px;
            font-family: var(--font-code);
            font-size: 0.9rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            color: var(--gold-primary);
            border-bottom-color: var(--gold-primary);
            background: rgba(240, 192, 90, 0.05);
        }

        /* Dynamic View Container */
        .content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .view-panel {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            padding: 20px;
            overflow-y: auto;
        }

        .view-panel.active {
            display: flex;
            flex-direction: column;
        }

        /* Arcade Cabinet View */
        .cabinet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding-bottom: 20px;
        }

        .cabinet-card {
            background: var(--panel-bg);
            border: 1px solid rgba(240, 192, 90, 0.3);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .cabinet-card:hover {
            transform: translateY(-4px);
            border-color: var(--gold-primary);
            box-shadow: 0 4px 20px rgba(240, 192, 90, 0.15);
        }

        .cabinet-title {
            font-family: var(--font-title);
            color: var(--gold-primary);
            font-size: 1.1
