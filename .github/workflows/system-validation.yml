name: System Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [key_rotation_event]

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Theme schema validation
        run: npm test -- tests/text-contrast-theme-vars.test.ts tests/rebellion-skin-integration.test.ts

      - name: Arcade registry integrity checks
        run: npm test -- tests/arcade-games-validation.test.ts

      - name: Game health checks - Star Matrix
        run: npm test -- tests/starMap.test.ts

      - name: Game health checks - Match Maker
        run: npm test -- tests/canonical-matchmaker.test.ts tests/constellationState.test.ts

      - name: Game health checks - Trinity
        run: npm test -- tests/matrix-trinity-alignment.test.ts

      - name: Instruction layer validation
        run: |
          test ! -f .github/copilot-instructions.md
          test ! -f docs/rulesets-and-agents.md

      - name: Type check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Enforce rollback gate on failure
        if: failure()
        run: |
          echo "Rollback gate engaged: this failed status blocks promotion."

      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to Firebase Hosting
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMAZING_GRACE_HL_BBEAA }}
          projectId: amazing-grace-hl-bbeaa
          channelId: live

  sync-secrets:
    name: Sync Secrets from Matrix (Key Master)
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'key_rotation_event'
    steps:
      - name: Update GitHub Actions Secret
        uses: appleboy/github-action-github-api-v3@master
        with:
          token: ${{ secrets.keyMaster }}
          method: PUT
          path: /repos/${{ github.repository }}/actions/secrets/${{ github.event.client_payload.secret_id }}
          body: |
            {
              "encrypted_value": "${{ github.event.client_payload.new_value }}",
              "key_id": "${{ github.event.client_payload.key_id }}"
            }

