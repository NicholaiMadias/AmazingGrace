​// Mini Games States

const [gameMode, setGameMode] = useState('tictactoe');

​// Tic Tac Toe

const [tttBoard, setTttBoard] = Array(9).fill(null).constructor ? useState(Array(9).fill(null)) : useState(Array(9).fill(null));

const [xIsNext, setXIsNext] = useState(true);

const [tttWinner, setTttWinner] = useState(null);

​// Number Guessing

const [targetNum, setTargetNum] = useState(Math.floor(Math.random() * 100) + 1);

const [guessInput, setGuessInput] = useState('');

const [guessMessage, setGuessMessage] = useState('Guess a number between 1 and 100!');

const [guessAttempts, setGuessAttempts] = useState(0);

​// Terminal State

const [terminalInput, setTerminalInput] = useState('');

const [terminalHistory, setTerminalHistory] = useState([

{ type: 'output', text: 'NICHOLAI_OS v4.2 [Secure Connection Established]' },

{ type: 'output', text: 'Type "help" to view available system commands.' }

]);

​useEffect(() => {

if (window.lucide) {

window.lucide.createIcons();

}

}, [activeTab, selectedProject, gameMode, terminalHistory]);

​// Portfolio Projects Data

const projects = [

{

id: 1,

title: "Neural Conscience OS",

category: "Fullstack",

tags: ["React", "Tailwind", "Node.js", "WebGL"],

},

{

category: "Frontend",

description: "Real-time orbital mechanics and stellar constellation tracking interface with interactive high-performance canvas visualizers.",

demoUrl: "#",

githubUrl: "#"

}

];

​// Contact Form Handler

const handleFormSubmit = (e) => {

e.preventDefault();

if (!formData.name || !formData.email || !formData.message) return;

setFormSubmitted(true);

if (window.confetti) {

window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

}

};

​// Tic Tac Toe Logic

const calculateWinner = (squares) => {

const lines = [

[0,1,2], [3,4,5], [6,7,8],

[0,3,6], [1,4,7], [2,5,8],

[0,4,8], [2,4,6]

];

for (let i = 0; i < lines.length; i++) {

const [a, b, c] = lines[i];

if (squares[a] && squares[a] === squares[b] && squares[a] === squares[c]) {

return squares[a];

}

}

return null;

};

​const handleTttClick = (i) => {

if (tttBoard[i] || tttWinner) return;

const newBoard = tttBoard.slice();

newBoard[i] = xIsNext ? 'X' : 'O';

setTttBoard(newBoard);

setXIsNext(!xIsNext);

const win = calculateWinner(newBoard);

if (win) {

setTttWinner(win);

if (window.confetti && win === 'X') {

window.confetti({ particleCount: 80, spread: 60 });

}

}

};

​const resetTtt = () => {

setTttBoard(Array(9).fill(null));

setXIsNext(true);

setTttWinner(null);

};

​// Number Guessing Logic

const handleGuessSubmit = (e) => {

e.preventDefault();

const num = parseInt(guessInput);

if (isNaN(num)) return;

setGuessAttempts(prev => prev + 1);

if (num === targetNum) {

setGuessMessage(🎉 Correct! You found the number ${targetNum} in ${guessAttempts + 1} attempts!);

if (window.confetti) window.confetti({ particleCount: 120, spread: 80 });

} else if (num < targetNum) {

setGuessMessage(📈 Too low! Try a higher number.);

} else {

setGuessMessage(📉 Too high! Try a lower number.);

}

setGuessInput('');

};

​const resetGuessGame = () => {

setTargetNum(Math.floor(Math.random() * 100) + 1);

setGuessInput('');

setGuessMessage('New number generated! Guess between 1 and 100.');

setGuessAttempts(0);

};

​// Terminal Command Handler

const handleTerminalSubmit = (e) => {

e.preventDefault();

const cmd = terminalInput.trim().toLowerCase();

if (!cmd) return;

​let newHistory = [...terminalHistory, { type: 'input', text: PS C:\\Nicholai> ${cmd} }];

​if (cmd === 'help') {

newHistory.push({ type: 'output', text: 'Available commands: about, skills, projects, contact, clear, matrix, date' });

} else if (cmd === 'about') {

newHistory.push({ type: 'output', text: 'Nicholai: Full-Stack Engineer, Creative Technologist & UI/UX Architect.' });

} else if (cmd === 'skills') {

newHistory.push({ type: 'output', text: 'Core Stack: React, TypeScript, Node.js, Python, TailwindCSS, WebGL, GraphQL.' });

} else if (cmd === 'projects') {

newHistory.push({ type: 'output', text: 'Active systems: Neural Conscience OS, Stellar Apex Dashboard, Cloud Firewall.' });

} else if (cmd === 'contact') {

newHistory.push({ type: 'output', text: 'Secure frequency: nicholai@portfolio.nexus // LinkedIn: /in/nicholai' });

} else if (cmd === 'matrix') {

newHistory.push({ type: 'output', text: 'WAKE UP, NEO... The matrix has you. 🟢🟢🟢' });

} else if (cmd === 'date') {

newHistory.push({ type: 'output', text: System Time: ${new Date().toLocaleString()} });

} else if (cmd === 'clear') {

newHistory = [];

} else {

newHistory.push({ type: 'output', text: Command not recognized: "${cmd}". Type "help" for assistance. });

}

​setTerminalHistory(newHistory);

setTerminalInput('');

};

​return (

max="100"

value={guessInput}

onChange={(e) => setGuessInput(e.target.value)}

placeholder="Enter 1 - 100"

className="w-full px-4 py-3 rounded-xl bg-black/60 border border-white/20 text-center text-[18px] font-bold text-amber-300 outline-none focus:border-amber-400"

/>

<button type="submit" className="w-full py-3 rounded-xl bg-amber-500 text-black font-bold text-[15px] hover:brightness-110 transition">

Submit Guess

</button>

</form>

<button onClick={resetGuessGame} className="text-white/60 hover:text-white text-[13px] underline">

Generate New Number

</button>

</div>

)}

​{/* Terminal CLI */}

{gameMode === 'terminal' && (

<div className="glass-panel rounded-[24px] p-6 border border-white/10 font-mono text-[14px] space-y-4 max-w-[700px] mx-auto">

<div className="flex items-center justify-between pb-3 border-b border-white/10 text-amber-400">

<span className="font-bold">> NICHOLAI_CLI_CONSOLE_v4.2</span>

<span className="text-[11px] text-white/50">SECURE SHELL</span>

</div>

<div className="h-[260px] overflow-y-auto space-y-2 text-white/80">

{terminalHistory.map((item, idx) => (

<p key={idx} className={item.type === 'input' ? 'text-amber-300 font-bold' : 'text-white/70'}>

{item.text}

</p>

))}

</div>

<form onSubmit={handleTerminalSubmit} className="flex items-center space-x-2 border-t border-white/10 pt-4">

<span className="text-amber-400 font-bold">PS C:\Nicholai></span>

<input

type="text"

value={terminalInput}

onChange={(e) => setTerminalInput(e.target.value)}

placeholder="Type 'help' or 'matrix'..."

className="flex-grow bg-transparent text-white outline-none font-mono"

autoFocus

/>

</form>

</div>

)}

</div>

)}

​{/* CONTACT TAB */}

{activeTab === 'contact' && (

<div className="max-w-[700px] mx-auto space-y-8">

<div className="text-center space-y-3">

<h1 className="text-[32px] md:text-[42px] font-black">Initiate Communication</h1>

<p className="text-white/70 text-[16px]">Have a project in mind or want to collaborate? Send a transmission below.</p>

</div>

​<div className="glass-panel rounded-[24px] p-8 md:p-10 border border-white/10">

{formSubmitted ? (

<div className="text-center py-12 space-y-4">

<div className="w-16 h-16 rounded-full bg-amber-500/20 border border-amber-400/50 flex items-center justify-center mx-auto text-amber-400 text-2xl font-bold">

✓

</div>

<h3 className="text-[24px] font-bold">Transmission Received!</h3>

<p className="text-white/70 text-[15px]">Thank you for reaching out, {formData.name}. I will review your message and get back to you shortly.</p>

<button

onClick={() => { setFormSubmitted(false); setFormData({ name: '', email: '', subject: '', message: '' }); }}

className="px-6 py-2.5 rounded-xl bg-amber-500 text-black font-bold text-[14px]"

>

Send Another Message

</button>

</div>

) : (

<form onSubmit={handleFormSubmit} className="space-y-6">

<div className="grid grid-cols-1 sm:grid-cols-2 gap-6">

<div className="space-y-2">

<label className="text-[13px] font-semibold text-white/80">Your Name</label>

<input

type="text"

required

value={formData.name}

onChange={(e) => setFormData({ ...formData, name: e.target.value })}

placeholder="John Doe"

className="w-full px-4 py-3 rounded-xl bg-black/50 border border-white/10 text-white outline-none focus:border-amber-400/60"

/>

</div>

<div className="space-y-2">

<label className="text-[13px] font-semibold text-white/80">Email Address</label>

<input

type="email"

required

value={formData.email}

onChange={(e) => setFormData({ ...formData, email: e.target.value })}

placeholder="john@example.com"

className="w-full px-4 py-3 rounded-xl bg-black/50 border border-white/10 text-white outline-none focus:border-amber-400/60"

/>

</div>

</div>

<div className="space-y-2">

<label className="text-[13px] font-semibold text-white/80">Subject</label>

<input

type="text"

value={formData.subject}

onChange={(e) => setFormData({ ...formData, subject: e.target.value })}

placeholder="Project Collaboration / Full-Time Role"

className="w-full px-4 py-3 rounded-xl bg-black/50 border border-white/10 text-white outline-none focus:border-amber-400/60"

/>

</div>

<div className="space-y-2">

<label className="text-[13px] font-semibold text-white/80">Message</label>

<textarea

rows="4"

required

value={formData.message}

onChange={(e) => setFormData({ ...formData, message: e.target.value })}

placeholder="Tell me about your project or inquiry..."

className="w-full px-4 py-3 rounded-xl bg-black/50 border border-white/10 text-white outline-none focus:border-amber-400/60 resize-none"

></textarea>

</div>

<button type="submit" className="w-full py-4 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-black font-bold text-[16px] hover:brightness-110 transition neon-glow-amber">

Transmit Message

</button>

</form>

)}

</div>

</div>

)}

​</main>

​{/* Project Details Modal */}

{selectedProject && (

<div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">

<div className="glass-panel rounded-[24px] max-w-[700px] w-full p-6 sm:p-8 border border-white/20 space-y-6 relative max-h-[90vh] overflow-y-auto">

<button

onClick={() => setSelectedProject(null)}

className="absolute top-4 right-4 p-2 rounded-full bg-white/10 hover:bg-white/20 text-white transition"

>

<i data-lucide="x" className="w-5 h-5"></i>

</button>

<div className="aspect-video rounded-xl overflow-hidden border border-white/10">

<img src={selectedProject.image} alt={selectedProject.title} className="w-full h-full object-cover" />

</div>

<div className="space-y-3">

<span className="px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-[12px] font-semibold border border-amber-400/30">

{selectedProject.category}

</span>

<h2 className="text-[26px] sm:text-[32px] font-extrabold">{selectedProject.title}</h2>

<p className="text-white/80 text-[15px] leading-relaxed">{selectedProject.description}</p>

<div className="flex flex-wrap gap-2 pt-2">

{selectedProject.tags.map(t => (

<span key={t} className="px-3 py-1 rounded-md bg-white/5 text-amber-300 text-[12px] font-semibold border border-white/10">

{t}

</span>

))}

</div>

</div>

<div className="flex space-x-4 pt-4 border-t border-white/10">

<a href={selectedProject.demoUrl} className="flex-1 py-3 rounded-xl bg-amber-500 text-black font-bold text-center hover:brightness-110 transition">

Live Demo

</a>

<a href={selectedProject.githubUrl} className="flex-1 py-3 rounded-xl glass-panel border border-white/20 text-white font-bold text-center hover:border-amber-400/40 transition">

Source Code

</a>

</div>

</div>

</div>

)}

​{/* Footer */}

<footer className="border-t border-white/10 glass-panel py-8 mt-20">

<div className="max-w-[1320px] mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">

<div>

<p className="text-[14px] font-bold">Nicholai • Complete Portfolio Nexus</p>

<p className="text-[12px] text-white/50 mt-1">© {new Date().getFullYear()} All rights reserved.</p>

</div>

<div className="flex space-x-4">

<a href="#" className="p-2.5 rounded-xl glass-panel border border-white/10 hover:border-amber-400/40 text-white/80 hover:text-amber-400 transition">

<i data-lucide="github" className="w-5 h-5"></i>

</a>

<a href="#" className="p-2.5 rounded-xl glass-panel border border-white/10 hover:border-amber-400/40 text-white/80 hover:text-amber-400 transition">

<i data-lucide="linkedin" className="w-5 h-5"></i>

</a>

<a href="#" className="p-2.5 rounded-xl glass-panel border border-white/10 hover:border-amber-400/40 text-white/80 hover:text-amber-400 transition">

<i data-lucide="twitter" className="w-5 h-5"></i>

</a>

</div>

</div>

</footer>

​</div>

);

}

​ReactDOM.render(<App />, document.getElementById('root'));

</script>

</body>

</html>
