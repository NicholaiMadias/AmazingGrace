  <style>
    /* ── Page layout ──────────────────────────────────────────── */
    .page-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    .hero {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
    }
    .hero h1 {
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      font-family: var(--font-mono);
      color: var(--matrix-green);
      text-shadow: 0 0 18px rgba(0,255,65,0.55);
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    .hero p {
      color: var(--matrix-text);
      font-size: 0.88rem;
      opacity: 0.7;
    }

    /* ── Tool grid ────────────────────────────────────────────── */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      margin-top: 2rem;
    }

    .tool-card {
      background: var(--matrix-panel);
      border: 1px solid var(--matrix-border);
      border-radius: 6px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .tool-card:hover { box-shadow: 0 0 16px rgba(0,255,65,0.18); }
    .tool-card.locked {
      border-color: var(--matrix-dim);
      opacity: 0.55;
    }

    .tool-card h2 {
      font-size: 1rem;
      color: var(--matrix-heading);
      letter-spacing: 0.06em;
      margin: 0;
    }
    .tool-card p {
      font-size: 0.8rem;
      color: var(--matrix-text);
      margin: 0;
      flex: 1;
    }

    .tool-badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.2rem 0.55rem;
      border-radius: 3px;
      font-family: var(--font-mono);
      letter-spacing: 0.05em;
    }
    .tool-badge.unlocked { background: var(--matrix-dim); color: var(--matrix-green); border: 1px solid var(--matrix-green); }
    .tool-badge.locked   { background: #1a0a0a; color: var(--matrix-red); border: 1px solid var(--matrix-red); }

    .tool-hint {
      font-size: 0.72rem;
      color: var(--matrix-red);
      font-style: italic;
    }

    .btn { cursor: pointer; font-family: var(--font-mono); font-size: 0.8rem; padding: 0.45rem 1rem; border-radius: 4px; border: 1px solid var(--matrix-green); background: transparent; color: var(--matrix-green); transition: background 0.15s, color 0.15s; text-decoration: none; display: inline-block; }
    .btn:hover, .btn:focus { background: var(--matrix-green); color: var(--matrix-dark); }
    .btn:disabled, .btn[aria-disabled="true"] { opacity: 0.35; pointer-events: none; }

    /* ── Login modal ──────────────────────────────────────────── */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--matrix-panel);
      border: 1px solid var(--matrix-border);
      border-radius: 6px;
      padding: 2rem;
      width: min(380px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal h2 { color: var(--matrix-heading); font-size: 1.1rem; margin: 0; }
    .modal label { font-size: 0.8rem; color: var(--matrix-text); }
    .modal input[type="email"],
    .modal input[type="password"] {
      width: 100%;
      background: var(--matrix-dark);
      border: 1px solid var(--matrix-border);
      color: var(--matrix-green);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      margin-top: 0.25rem;
    }
    .modal-actions { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem; }
    .modal-row { display: flex; gap: 0.75rem; justify-content: flex-end; width: 100%; }
    .modal-links { display: flex; justify-content: space-between; font-size: 0.75rem; font-family: var(--font-mono); }
    .modal-links a { color: var(--matrix-cyan); text-decoration: none; }
    .modal-links a:hover { text-decoration: underline; }
    #login-error { color: var(--matrix-red); font-size: 0.78rem; min-height: 1em; }

    /* ── PowerShell Terminal Console ──────────────────────────── */
    #console-panel {
      background: #011627;
      border: 1px solid #00f3ff;
      border-radius: 6px;
      padding: 16px;
      color: #d6deeb;
      margin-top: 2.5rem;
      font-family: Consolas, Monaco, monospace;
    }
    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e3a5f;
      padding-bottom: 8px;
    }
    .console-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin: 0;
      color: #00f3ff;
    }
    .powershell-output {
      background-color: #010b14;
      border: 1px solid #1e3a5f;
      border-radius: 4px;
      padding: 12px;
      height: 240px;
      overflow-y: auto;
      font-size: 0.85rem;
      margin-bottom: 12px;
      white-space: pre-wrap;
      color: #00ff66;
    }
    .powershell-input-line {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #010b14;
      border: 1px solid #1e3a5f;
      border-radius: 4px;
      padding: 6px 10px;
    }
    .powershell-prompt {
      color: #82aaff;
      font-weight: bold;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .powershell-input-line input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      color: #d6deeb;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.9rem;
      outline: none;
    }
    .ps-btn {
      background: #1e3a5f;
      color: #00f3ff;
      border: 1px solid #00f3ff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.8rem;
    }
    .ps-btn:hover { background: #00f3ff; color: #011627; }

    /* ── Status bar ───────────────────────────────────────────── */
    #status-bar { font-size: 0.75rem; color: var(--matrix-text); opacity: 0.55; margin-top: 1.5rem; text-align: center; }
  </style>
</head>
